[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "/bin/sh -c \"uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2\""
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

