  <text x="1105" y="542" font-family="Arial, sans-serif" font-size="13" fill="#334038">chất ma túy, hướng dẫn trồng cây có chứa chất ma túy. 2.</text>
  <text x="1105" y="563" font-family="Arial, sans-serif" font-size="13" fill="#334038">Nghiên cứu, giám định, kiểm nghiệm, kiểm định, sản xuất,</text>
