  <text x="303" y="465" font-family="Arial, sans-serif" font-size="15" fill="#111">Theo Điều 5 Luật Phòng, chống ma túy 2021, các hành vi bị nghiêm cấm gồm:</text>
  <text x="303" y="512" font-family="Arial, sans-serif" font-size="15" fill="#111">- 1. Trồng cây có chứa chất ma túy, hướng dẫn trồng cây có chứa chất ma túy.</text>
  <text x="303" y="539" font-family="Arial, sans-serif" font-size="15" fill="#111">- 2. Nghiên cứu, giám định, kiểm nghiệm, kiểm định, sản xuất, tàng trữ, vận chuyển,</text>
  <text x="303" y="562" font-family="Arial, sans-serif" font-size="15" fill="#111">  bảo quản, tồn trữ, mua bán, phân phối, xử lý, trao đổi, xuất khẩu, nhập khẩu...</text>
  <text x="303" y="608" font-family="Arial, sans-serif" font-size="15" fill="#111">- 3. Chiếm đoạt chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần...</text>
  <text x="303" y="654" font-family="Arial, sans-serif" font-size="15" fill="#111">- 4. Giao nhận, quản lý, kiểm soát, lưu giữ, cấp phát, bảo quản chất ma túy...</text>
  <text x="303" y="700" font-family="Arial, sans-serif" font-size="15" fill="#111">- 5. Sử dụng, tổ chức sử dụng trái phép chất ma túy; cưỡng bức, lôi kéo người khác...</text>
  <text x="303" y="746" font-family="Arial, sans-serif" font-size="15" fill="#111">- 6. Sản xuất, tàng trữ, vận chuyển, mua bán phương tiện, dụng cụ dùng vào việc...</text>
  <text x="303" y="792" font-family="Arial, sans-serif" font-size="15" fill="#111">- 7. Chống lại hoặc cản trở việc xét nghiệm chất ma túy trong cơ thể...</text>
  <text x="303" y="838" font-family="Arial, sans-serif" font-size="15" fill="#111">- 8. Trả thù hoặc cản trở người thực thi nhiệm vụ phòng, chống ma túy...</text>
  <text x="303" y="939" font-family="Arial, sans-serif" font-size="15" fill="#111">Nội dung này là thông tin tham khảo, không thay thế tư vấn pháp lý chính thức. [73_2021_QH14_445185.md, 2021]</text>

